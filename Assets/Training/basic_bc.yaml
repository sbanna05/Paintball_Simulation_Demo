behaviors:
  BasicAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.0002
      beta: 0.01
      epsilon: 0.25
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        gamma: 0.9
        strength: 0.05
        demo_path: ../Demonstrations/BasicPlayer.demo
        network_settings:
          normalize: true
    behavioral_cloning:
      strength: 0.2
      demo_path: ../Demonstrations/BasicPlayer.demo
      steps: 300000
    max_steps: 4000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 100000
    keep_checkpoints: 5
    threaded: true