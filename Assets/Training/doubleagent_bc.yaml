behaviors:
  DoubleAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0002
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        encoding_size: 128
      gail:
        gamma: 0.99
        strength: 0.1
        demo_path: C:\Users\Anna\Documents\tananyagok\Egyetemes\5th\szakdoga\Paintball_Simulation_Demo\Assets\Demonstrations\DoubleAgentDemo.demo
    behavioral_cloning:
      demo_path: C:\Users\Anna\Documents\tananyagok\Egyetemes\5th\szakdoga\Paintball_Simulation_Demo\Assets\Demonstrations\DoubleAgentDemo.demo
      strength: 0.5 # Mennyire erősen próbálja másolni a játékost
      steps: 100000 # Hány lépésig tartson az intenzív utánzás
    self_play:
      window: 10
      play_against_latest_model_ratio: 0.7
      save_steps: 40000
      swap_steps: 20000
      team_change: 200000
    max_steps: 5000000
    time_horizon: 128 # Alacsonyabb érték jobb a gyors reakciókat igénylő lövöldözéshez
    summary_freq: 10000
    threaded: true