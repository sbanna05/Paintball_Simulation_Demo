behaviors:
  DoubleAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.00015
      beta: 0.001
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 2
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        encoding_size: 128
    behavioral_cloning:
      demo_path: ../Demonstrations/DoubleDemoRay.demo
      strength: 0.4
      steps: 300000
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
    threaded: true